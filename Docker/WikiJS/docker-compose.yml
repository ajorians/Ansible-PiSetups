version: "3"
services:
  wikijs:
    image: ghcr.io/requarks/wiki:latest
    container_name: wikijs
    init: true
    environment:
      TZ: "America/Detroit"
      DB_TYPE: ${DB_TYPE}
      DB_HOST: ${DB_HOST}
      DB_PORT: "3306"
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - /opt/DockerSwarmData/wikijs/config:/config
      - /opt/DockerSwarmData/wikijs/data:/data
    ports:
      - "5700:3000"
    restart: unless-stopped

