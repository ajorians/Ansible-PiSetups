# Run with
# ansible-playbook SetupWikiJS.yml
# https://github.com/Requarks/wiki

---
- name: Setup WikiJS
  hosts: all
  tasks:

  - name: Create directory for data
    file:
      path: "{{ item }}"
      state: directory
      owner: ajorians
      group: users
      mode: 0777
    loop:
      - /opt/DockerSwarmData/wikijs/
      - /opt/DockerSwarmData/wikijs/config
      - /opt/DockerSwarmData/wikijs/data
      - /root/docker
      - /root/docker/wikijs

  - name: Create Database
    community.mysql.mysql_db:
      login_user: root
      name:
        - wikijs
      state: present

  - name: Grant user access
    community.mysql.mysql_user:
      login_user: root
      state: present
      name: wikijsuser
      host: '%'
      password: wikijspassword 
      priv:
        'wikijs.*': 'ALL,GRANT'

  - name: Copy the docker-compose file with owner and permissions
    ansible.builtin.copy:
      src: docker-compose.yml
      dest: /root/docker/wikijs
      owner: ajorians
      group: users
      mode: 0777

  - name: Deploy WikiJS from a compose file
    community.docker.docker_compose_v2:
      project_src: /root/docker/wikijs
    environment:
      DB_TYPE: "mariadb"
      DB_HOST: "10.0.0.4"
      DB_PORT: "3306"
      DB_NAME: "wikijs"
      DB_USER: "wikijsuser"
      DB_PASSWORD: "wikijspassword"

  - name: Make Apache VHost file
    ansible.builtin.copy:
      dest: /etc/apache2/vhosts.d/wikijs.conf
      force: false
      content: |
        <VirtualHost *:80>
          ServerName internal.orians.org
          ServerAlias wikijs.orians.org wikijs.stage.orians.org wikijs
          ProxyPass / http://127.0.0.1:5700/
          ProxyPassReverse / http://127.0.0.1:5700/
        </VirtualHost>
    when:
    - ansible_facts['distribution'].find("openSUSE") != -1
    notify:
    - Restart Apache2 service

  - name: Make Apache VHost file
    ansible.builtin.copy:
      dest: /etc/apache2/sites-available/wikijs.conf
      force: false
      content: |
        <VirtualHost *:80>
          ServerName internal.orians.org
          ServerAlias wikijs.orians.org wikijs.stage.orians.org wikijs
          ProxyPass / http://127.0.0.1:5700/
          ProxyPassReverse / http://127.0.0.1:5700/
        </VirtualHost>
    when:
    - ansible_facts['distribution'].find("openSUSE") == -1
    notify:
    - Restart Apache2 service

  handlers:
    - name: Restart Apache2 service
      ansible.builtin.systemd:
        state: restarted
        name: apache2
